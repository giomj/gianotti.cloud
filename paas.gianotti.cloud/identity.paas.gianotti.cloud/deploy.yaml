name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY_NAME: ${{ vars.DO_REGISTRY_NAME }}
  CLUSTER_NAME: ${{ vars.DO_CLUSTER_NAME }}
  DATABASE_CLUSTER_NAME: ${{ vars.DO_DATABASE_CLUSTER_NAME }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to the registry
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          REGISTRY="registry.digitalocean.com/${REGISTRY_NAME}"
          for pair in "identity-admin:admin-ui" "api:apps/api" "jobs:apps/jobs" "web:apps/web"; do
            name="${pair%%:*}"; context="${pair#*:}"
            docker build --platform linux/amd64 -t "$REGISTRY/$name:$TAG" -t "$REGISTRY/$name:latest" "$context"
            docker push "$REGISTRY/$name:$TAG"
            docker push "$REGISTRY/$name:latest"
          done

  platform:
    name: Apply platform stage
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Fetch kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

      - name: Terraform apply
        env:
          TF_VAR_do_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_domain: ${{ vars.PLATFORM_DOMAIN }}
          TF_VAR_letsencrypt_email: ${{ vars.LETSENCRYPT_EMAIL }}
          TF_VAR_cluster_name: ${{ vars.DO_CLUSTER_NAME }}
          TF_VAR_database_cluster_name: ${{ vars.DO_DATABASE_CLUSTER_NAME }}
          TF_VAR_registry_name: ${{ vars.DO_REGISTRY_NAME }}
          TF_VAR_admin_ui_image: registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}/identity-admin:${{ needs.build.outputs.tag }}
        run: |
          terraform -chdir=terraform/02-platform init -input=false
          terraform -chdir=terraform/02-platform apply -input=false -auto-approve

  apps:
    name: Roll out applications
    runs-on: ubuntu-latest
    needs: [build, platform]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Fetch kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"

      - name: Apply manifests
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
        run: |
          export REGISTRY="registry.digitalocean.com/${REGISTRY_NAME}"
          export IMAGE_API="$REGISTRY/api:$TAG"
          export IMAGE_JOBS="$REGISTRY/jobs:$TAG"
          export IMAGE_WEB="$REGISTRY/web:$TAG"
          for manifest in k8s/apps/*.yaml; do
            envsubst < "$manifest" | kubectl apply -f -
          done

      - name: Wait for the rollout
        run: |
          kubectl -n api  rollout status deploy/api  --timeout=300s
          kubectl -n jobs rollout status deploy/jobs --timeout=300s
          kubectl -n web  rollout status deploy/web  --timeout=300s