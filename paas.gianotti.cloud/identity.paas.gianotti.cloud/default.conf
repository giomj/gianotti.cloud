server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The load balancer and ingress already log; keep container logs quiet.
    access_log   /dev/stdout combined;
    error_log    /dev/stderr warn;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  512;

    add_header X-Content-Type-Options  "nosniff"  always;
    add_header X-Frame-Options         "DENY"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' ${OIDC_ORIGIN} ${API_ORIGIN}; form-action 'self' ${OIDC_ORIGIN}; frame-ancestors 'none'; base-uri 'none'" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Runtime configuration must never be cached, or a redeploy would leave
    # browsers pointing at the previous environment.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Single page app: the OAuth redirect lands on /callback, which has no file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
