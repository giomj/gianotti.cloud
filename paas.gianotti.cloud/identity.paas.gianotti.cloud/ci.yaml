name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Build toolchain image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ops image
        uses: docker/build-push-action@v6
        with:
          context: ops
          push: false
          load: true
          tags: platform-ops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    needs: toolchain
    strategy:
      matrix:
        stage: [01-infra, 02-platform]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Format
        run: terraform -chdir=terraform/${{ matrix.stage }} fmt -check -diff

      - name: Init without a backend
        run: terraform -chdir=terraform/${{ matrix.stage }} init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform/${{ matrix.stage }} validate

  code:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check every source file
        run: |
          find admin-ui/src admin-ui/public apps/*/src apps/web/html \
            -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Shell check
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh scripts/ops dev/*.sh || true
          bash -n scripts/keycloak-bootstrap.sh
          bash -n scripts/bootstrap.sh

  images:
    name: Build application images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: identity-admin
            context: admin-ui
          - name: api
            context: apps/api
          - name: jobs
            context: apps/jobs
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  stack:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 420

      - name: The realm exists and advertises Google when configured
        run: |
          curl -fsS http://localhost:8080/realms/platform/.well-known/openid-configuration | jq -e '.issuer'

      - name: The admin console can reach Keycloak
        run: |
          curl -fsS http://localhost:8081/api/config | jq -e '.realm == "platform"'

      - name: The API is ready and rejects unauthenticated calls
        run: |
          curl -fsS http://localhost:3000/readyz | jq -e '.database == "up"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/whoami)" = "401"

      - name: The web frontend serves its runtime config
        run: |
          curl -fsS http://localhost:3001/config.js | grep -q 'clientId'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v