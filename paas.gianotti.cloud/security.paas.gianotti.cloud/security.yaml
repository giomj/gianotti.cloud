name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Re-scan images already in production: a clean scan at build time says
    # nothing about a CVE published the following week.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  vulnerabilities:
    name: Scan images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-admin
            context: admin-ui
          - name: api
            context: apps/api
          - name: jobs
            context: apps/jobs
          - name: web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.name }}:scan

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: image-${{ matrix.name }}

      - name: Fail on fixable critical findings
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.name }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac:
    name: Infrastructure and manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov against Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Kubernetes manifests are valid
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          export IMAGE_API=x IMAGE_JOBS=x IMAGE_WEB=x DOMAIN=example.com \
                 LETSENCRYPT_EMAIL=a@b.c LETSENCRYPT_SERVER=https://acme \
                 APP_NAME=app APP_IMAGE=x
          for f in k8s/apps/*.yaml k8s/*.yaml; do
            envsubst < "$f" | ./kubeconform -strict -ignore-missing-schemas -summary -
          done

      - name: Policies parse
        run: |
          export FAILURE_ACTION=Enforce ALLOWED_REGISTRIES_YAML='registry.example.com/*' COSIGN_PUBLIC_KEY=x
          for f in security/kyverno/*.yaml security/linkerd/*.yaml security/falco/*.yaml; do
            envsubst < "$f" | python3 -c 'import sys,yaml; list(yaml.safe_load_all(sys.stdin)); print("ok")'
          done

  sign:
    name: Sign and attest images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [vulnerabilities, secrets, iac]
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - run: doctl registry login --expiry-seconds 1800

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Sign images and publish SBOMs
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          TAG: ${{ github.sha }}
        run: |
          REGISTRY="registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME }}"
          for name in identity-admin api jobs web; do
            ref="$REGISTRY/$name:$TAG"
            # Sign the digest, not the tag: a tag can be moved, a digest cannot.
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$REGISTRY/$name@$digest"
            syft "$REGISTRY/$name@$digest" -o spdx-json > "sbom-$name.json"
            cosign attest --yes --key env://COSIGN_PRIVATE_KEY \
              --type spdxjson --predicate "sbom-$name.json" "$REGISTRY/$name@$digest"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.json
          retention-days: 90

  controls:
    name: Verify controls in the cluster
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: sign
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - run: doctl kubernetes cluster kubeconfig save "${{ vars.DO_CLUSTER_NAME }}"

      - name: Verify
        run: bash scripts/verify-controls.sh

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-evidence
          path: evidence-*.md
          # PCI DSS 10.5.1 asks for 12 months of audit history.
          retention-days: 365